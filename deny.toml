# cargo-deny configuration.

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The whole reason the static musl build works is that no C crypto is linked. If
# one of these ever appears, the Dockerfile must move to distroless/cc — so make
# it a build failure rather than a surprise.
deny = [
    { name = "ring" },
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
    { name = "openssl-sys" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
