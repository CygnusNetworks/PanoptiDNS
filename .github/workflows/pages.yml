name: Project site (GitHub Pages)

# Deploys the static landing page (English at /, German at /de/) to
#   https://cygnusnetworks.github.io/PanoptiDNS/
#
# Runs when the site changes on main, on release tags, and on manual dispatch.
# One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble Pages site
        run: |
          set -euo pipefail
          rm -rf _site
          cp -a site _site
          ls -laR _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
