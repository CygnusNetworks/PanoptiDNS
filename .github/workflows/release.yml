name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write
  # Required for cosign keyless signing via the GitHub OIDC provider.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Never publish something that does not pass the same gates as main.
  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --no-fail-fast
      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $crate, tag: $tag"
          test "$crate" = "$tag"

  binaries:
    name: Static binary (${{ matrix.target }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: panoptidns-x86_64-linux-musl
          - target: aarch64-unknown-linux-musl
            name: panoptidns-aarch64-linux-musl
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2

      - run: cross build --release --locked --target ${{ matrix.target }}

      # Fully static: the whole point of keeping C crypto out of the tree, and
      # what lets the image be distroless/static rather than distroless/cc.
      #
      # The two targets describe themselves differently — x86_64-musl produces
      # "static-pie linked" and aarch64-musl "statically linked" — so assert on
      # the absence of dynamic linking, which is the property we actually care
      # about, rather than on one spelling of it.
      - name: Assert the binary is static
        run: |
          f="target/${{ matrix.target }}/release/panoptidns"
          file "$f"
          if file "$f" | grep -q "dynamically linked"; then
            echo "::error::$f is dynamically linked; distroless/static cannot run it."
            exit 1
          fi
          file "$f" | grep -qE "static-pie linked|statically linked"

      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/panoptidns" dist/
          cp README.md LICENSE NOTICE CHANGELOG.md SECURITY.md panoptidns.conf.example dist/
          cp -r docs dist/
          cp packaging/panoptidns.service dist/
          tar -C dist -czf "${{ matrix.name }}.tar.gz" .
          sha256sum "${{ matrix.name }}.tar.gz" > "${{ matrix.name }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256

  image:
    name: Container image
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: without the secrets the image still ships to
      # GHCR rather than the whole release turning red.
      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -n "$USERNAME" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKER_USERNAME/DOCKER_TOKEN not set; publishing to GHCR only."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.dockerhub.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Both registries get the same tags. metadata-action lowercases the
          # image path, which GHCR requires and Docker Hub expects.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub.outputs.ready == 'true' && 'docker.io/cygnusnetworks/panoptidns' || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=PanoptiDNS
            org.opencontainers.image.description=Authoritative DNS server that synthesizes IPv6 reverse (PTR) and forward (AAAA) records on the fly

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Lets consumers verify the image really came from this workflow.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The push above is what creates the Docker Hub repository, so this is the
      # first moment the description can be set. Doing it here means a fresh
      # repository is never left with an empty description.
      - name: Sync Docker Hub description
        if: steps.dockerhub.outputs.ready == 'true'
        run: |
          python3 .github/scripts/absolutise_links.py \
            "${{ github.repository }}" README.md DOCKERHUB.md

      - name: Push description
        if: steps.dockerhub.outputs.ready == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: cygnusnetworks/panoptidns
          readme-filepath: ./DOCKERHUB.md
          # Docker Hub truncates this at 100 bytes.
          short-description: >-
            Authoritative IPv6 rDNS: synthesizes PTR and AAAA records on the fly,
            no zone file for a /64

  release:
    name: Publish release
    needs: [binaries, image]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      # `pattern` is required: docker/build-push-action also uploads a
      # `*.dockerbuild` build-record artifact, and downloading everything makes
      # the merge fail on that special format with "Artifact download failed
      # after 5 retries".
      - uses: actions/download-artifact@v4
        with:
          pattern: panoptidns-*
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          generate_release_notes: true
          body: |
            PanoptiDNS synthesizes IPv6 reverse (PTR) and matching forward (AAAA)
            records per query, so no zone file is needed for a /64. It is a Rust
            reimplementation of [AllKnowingDNS](https://metacpan.org/dist/AllKnowingDNS)
            v1.7 and reads the same configuration file.

            ## Container image

            ```sh
            docker pull ghcr.io/cygnusnetworks/panoptidns:${{ github.ref_name }}
            docker pull cygnusnetworks/panoptidns:${{ github.ref_name }}
            ```

            Multi-arch (amd64/arm64), ~5 MB, distroless, runs as uid 65532, with
            build provenance attestation.

            ## Static binaries

            Fully static musl builds for x86_64 and aarch64, with `.sha256`
            checksums. Each archive also contains the example config, the systemd
            unit and the docs.

            ## Security

            Six defects found in AllKnowingDNS v1.7 are structurally absent here
            rather than patched, each with a named regression test. Most
            seriously, the original could be terminated by a single
            unauthenticated UDP packet, because it built resource records by
            interpolating the query name into a DNS master-file presentation
            string.

            See [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md).

            ## Upgrading from AllKnowingDNS

            Run `panoptidns --check-config -c /etc/all-knowing-dns.conf` first.
            Malformed `network` lines, unknown directives and a missing
            `%DIGITS%` are now fatal rather than silently ignored. Every
            behavioural difference is listed in the
            [migration guide](https://github.com/${{ github.repository }}/blob/main/docs/MIGRATION-from-AllKnowingDNS.md).

            Full changelog: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
